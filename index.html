<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smash Ultimate Randomizer</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#eef2ff;background:#0b1020}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1c2850,#0b1020 60%);min-height:100vh}header{padding:22px max(20px,calc((100vw - 1180px)/2));border-bottom:1px solid #35415d;background:#101a31e8;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}h1{font-size:23px;margin:0}h2{margin:0 0 16px}h3{margin:12px 0}small,.muted{color:#a6b2d0}nav{display:flex;gap:8px;flex-wrap:wrap}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #435374;background:#263553;color:white;border-radius:10px;padding:10px 15px;font-weight:650}button:hover{background:#364b77}button.primary{background:#6556e8;border-color:#8178fa}button.danger{background:#633143;border-color:#98506a}button:disabled{opacity:.45;cursor:not-allowed}nav button.active{background:#6556e8}main{max-width:1180px;margin:auto;padding:26px 20px 70px}.panel{background:#141e35;border:1px solid #34405b;border-radius:17px;padding:20px;margin-bottom:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0 18px}input,select{background:#0c162c;border:1px solid #4a5774;color:white;border-radius:9px;padding:10px;max-width:100%}input{min-width:150px}.tiers{display:flex;flex-direction:column;gap:22px}.tiergroup{width:100%}.tierfighters{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px;margin-top:14px}.tiergroup h3{display:flex;align-items:center;gap:12px;font-size:21px}.tiergroup h3 .pill{min-width:42px;font-size:18px}.tiergroup{border:1px solid #36445e;border-radius:12px;padding:12px;background:#101a2e}.tiergroup h3{margin:0 0 10px}.fighter{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 7px;background:#192741;border:1px solid #34425f;border-radius:12px;text-align:center;min-width:0}.fighter .name{font-size:13px;font-weight:700;min-height:34px;display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere}.fighter select{padding:6px;width:100%}.fighter .portrait{width:100px;height:100px}.portrait{width:56px;height:56px;object-fit:contain;background:#23304a;border-radius:9px;flex-shrink:0}.portrait.fallback{display:grid;place-items:center;font-weight:900;color:#bfcfff}.pill{display:inline-flex;align-items:center;justify-content:center;padding:4px 9px;border-radius:7px;font-weight:900;color:#131725}.S{background:#d9b54b}.A{background:#ed6366}.B{background:#fff0a8}.C{background:#61c88b}.D{background:#5fa8f0}.playergrid,.results,.statsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.playercard,.resultcard{background:#101a2e;border:1px solid #34425f;border-radius:14px;padding:16px}.resultcard{text-align:center}.resultcard .portrait{width:170px;height:170px;margin:12px auto}.resultcard h3{font-size:22px}.history{max-height:300px;overflow:auto;padding-left:25px}.history li{padding:5px 0}.statrow{display:flex;justify-content:space-between;margin:10px 0}.bar{height:13px;background:#293550;border-radius:8px;overflow:hidden;flex:1}.bar>div{height:100%}.chartrow{display:flex;gap:10px;align-items:center;margin:9px 0}.chartrow b{width:18px}.chartrow span{width:22px;text-align:right}.streaknotice{margin:12px 0;padding:12px 15px;border-radius:10px;border:1px solid #a18a49;background:#352d20;color:#ffe5a0;font-weight:700}.streaknotice.buff{border-color:#6aa8e7;background:#1c314b;color:#c5e4ff}.notice{background:#2a3154;border:1px solid #756fe4;padding:12px 16px;border-radius:12px;margin-bottom:15px}.hidden{display:none!important}.actions{display:flex;gap:10px;flex-wrap:wrap}.empty{color:#b1bedc;padding:25px;text-align:center}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#343d74;border:1px solid #a2a7ff;color:white;border-radius:12px;padding:15px 25px;box-shadow:0 12px 40px #0009;z-index:10;display:none;max-width:90vw;text-align:center}label{display:inline-flex;align-items:center;gap:8px}p{line-height:1.5}@media(max-width:600px){header{padding:16px}main{padding:16px 12px}h1{font-size:20px}.panel{padding:14px}}
[hidden]{display:none!important} .brand-icon{width:34px;height:34px;object-fit:contain;vertical-align:middle;margin-right:8px} </style></head><body><header><div><h1><img src="https://ssb.wiki.gallery/images/c/c2/SmashBrosSymbol.svg" alt="Smash Ball" class="brand-icon"> Smash Ultimate Randomizer</h1><small>Custom tiers · Fair picks · Player history</small></div><nav><button data-page="tiers" class="active">Tier List</button><button data-page="players">Players</button><button data-page="randomizer">Randomizer</button><button data-page="stats">Stats</button></nav></header><main id="app"></main><div id="toast" role="status"></div><script>
const names=`Mario|Donkey Kong|Link|Samus|Dark Samus|Yoshi|Kirby|Fox|Pikachu|Luigi|Ness|Captain Falcon|Jigglypuff|Peach|Daisy|Bowser|Ice Climbers|Sheik|Zelda|Dr. Mario|Pichu|Falco|Marth|Lucina|Young Link|Ganondorf|Mewtwo|Roy|Chrom|Mr. Game & Watch|Meta Knight|Pit|Dark Pit|Zero Suit Samus|Wario|Snake|Ike|Pokémon Trainer|Diddy Kong|Lucas|Sonic|King Dedede|Olimar|Lucario|R.O.B.|Toon Link|Wolf|Villager|Mega Man|Wii Fit Trainer|Rosalina & Luma|Little Mac|Greninja|Mii Brawler|Mii Swordfighter|Mii Gunner|Palutena|Pac-Man|Robin|Shulk|Bowser Jr.|Duck Hunt|Ryu|Ken|Cloud|Corrin|Bayonetta|Inkling|Ridley|Simon|Richter|King K. Rool|Isabelle|Incineroar|Piranha Plant|Joker|Hero|Banjo & Kazooie|Terry|Byleth|Min Min|Steve|Sephiroth|Pyra/Mythra|Kazuya|Sora`.split('|');
const KEY='smash-ultimate-randomizer-v2';const T=['S','A','B','C','D'];const points={S:5,A:4,B:3,C:2,D:1};const defaults={"Bowser":"S","Palutena":"S","Cloud":"S","King K. Rool":"S","Joker":"S","Banjo & Kazooie":"S","Byleth":"S","Min Min":"S","Pyra/Mythra":"S","Ike":"S","Sephiroth":"S","Link":"A","Samus":"A","Dark Samus":"A","Yoshi":"A","Captain Falcon":"A","Zelda":"A","Young Link":"A","Roy":"A","Pokémon Trainer":"A","R.O.B.":"A","Robin":"A","Inkling":"A","Ridley":"A","Piranha Plant":"A","Ganondorf":"A","Marth":"A","Lucina":"A","Chrom":"A","Pit":"A","Dark Pit":"A","Wii Fit Trainer":"A","Toon Link":"A","Greninja":"A","Corrin":"A","Hero":"A","Kazuya":"A","Mario":"B","Donkey Kong":"B","Kirby":"B","Pikachu":"B","Ness":"B","Peach":"B","Daisy":"B","Falco":"B","Mr. Game & Watch":"B","King Dedede":"B","Wolf":"B","Simon":"B","Richter":"B","Incineroar":"B","Terry":"B","Luigi":"B","Dr. Mario":"B","Mewtwo":"B","Zero Suit Samus":"B","Snake":"B","Little Mac":"B","Sonic":"B","Lucas":"B","Bowser Jr.":"B","Duck Hunt":"B","Sora":"B","Mii Brawler":"B","Mii Gunner":"B","Fox":"C","Jigglypuff":"C","Ice Climbers":"C","Sheik":"C","Lucario":"C","Villager":"C","Rosalina & Luma":"C","Bayonetta":"C","Isabelle":"C","Steve":"C","Mii Swordfighter":"C","Pichu":"C","Wario":"C","Pac-Man":"C","Shulk":"C","Ryu":"C","Ken":"C","Diddy Kong":"D","Olimar":"D","Mega Man":"D","Meta Knight":"D"};const fresh=()=>({defaults:{...defaults},tiers:{...defaults},saved:{},players:[],history:{},pool:[...names],current:[],selectedList:'',configured:false});let state;try{state={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=fresh()}state.defaults={...defaults,...state.defaults};state.tiers={...state.defaults,...state.tiers};let page='tiers',editing=false,notice='';function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){const el=document.querySelector('#toast');el.textContent=s;el.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>el.style.display='none',2600)}function portrait(n){const slug=n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');const overrides={'Pyra/Mythra':'pyra','Pokémon Trainer':'pokemon_trainer','Mr. Game & Watch':'mr_game_and_watch','R.O.B.':'rob','Banjo & Kazooie':'banjo_and_kazooie','Rosalina & Luma':'rosalina_and_luma','King K. Rool':'king_k_rool','Bowser Jr.':'bowser_jr','Duck Hunt':'duck_hunt','Zero Suit Samus':'zero_suit_samus','Hero':'dq_hero','Min Min':'minmin','Mii Brawler':'mii_fighter','Mii Swordfighter':'mii_fighter','Mii Gunner':'mii_fighter'};const id=overrides[n]||slug;const portraitOverrides={'Mii Brawler':'https://ssb.wiki.gallery/images/thumb/e/e4/Mii_Brawler_SSBU.png/250px-Mii_Brawler_SSBU.png','Mii Gunner':'https://ssb.wiki.gallery/images/thumb/e/e5/Mii_Gunner_SSBU.png/250px-Mii_Gunner_SSBU.png','Mii Swordfighter':'https://ssb.wiki.gallery/images/thumb/f/fa/Mii_Swordfighter_SSBU.png/250px-Mii_Swordfighter_SSBU.png'};const url=portraitOverrides[n]||('https://www.smashbros.com/assets_v2/img/fighter/'+id+'/main.png');const fallback=n.split(/\s+/).map(w=>w[0]).join('').slice(0,3);return `<img class="portrait" loading="lazy" decoding="async" alt="${esc(n)} portrait" src="${url}" onerror="this.onerror=null;this.outerHTML='<div class=&quot;portrait fallback&quot;>${esc(fallback)}</div>'">`}

function tier(n){return `<span class="pill ${state.tiers[n]}">${state.tiers[n]}</span>`}function setPage(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
function render(){const app=document.querySelector('#app');if(page==='tiers')renderTiers(app);if(page==='players')renderPlayers(app);if(page==='randomizer')renderRandomizer(app);if(page==='stats')renderStats(app)}
let tierSearchQuery="";
function renderTiers(app){let groups=T.map(t=>`<section class="tiergroup"><h3><span class="pill ${t}">${t}</span> <small>${names.filter(n=>state.tiers[n]===t).length} fighters</small></h3><div class="tierfighters">${names.filter(n=>state.tiers[n]===t && n.toLocaleLowerCase().includes(tierSearchQuery.toLocaleLowerCase())).sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:'base'})).map(n=>`<div class="fighter"><span class="name">${esc(n)}</span>${portrait(n)}<select aria-label="Tier for ${esc(n)}" data-fighter="${esc(n)}">${T.map(v=>`<option ${v===state.tiers[n]?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')||'<small>No fighters</small>'}</div></section>`).join('');app.innerHTML=`<div class="panel"><h2>Tier List</h2><p class="muted">Edit fighter tiers, then save a named list. Your custom default tier list is preloaded from tierList.xlsx. You can change tiers, save named lists, or reset to these defaults.</p><div class="toolbar"><input id="listName" placeholder="Tier list name" value="${esc(state.selectedList)}"><button class="primary" id="saveList">Save Tier List</button><select id="savedSelect"><option value="">Select saved list</option>${Object.keys(state.saved).map(n=>`<option ${n===state.selectedList?'selected':''} value="${esc(n)}">${esc(n)}</option>`).join('')}</select><button id="loadList">Load</button><button id="deleteList" class="danger">Delete Saved List</button><button id="resetTiers">Reset to Default</button></div><details><summary>Import your custom default tier list</summary><p class="muted">Paste a JSON object of character names and tiers, e.g. {"Mario":"A","Link":"B"}. Unspecified fighters retain their current default. Importing sets the new defaults and resets the active tier list to them.</p><textarea id="importJson" rows="5" style="width:100%;background:#0c162c;color:white;border-radius:10px;padding:12px" placeholder='{"Mario":"A","Link":"B"}'></textarea><div class="toolbar"><button id="importDefault">Import Default Tiers</button><button id="exportTiers">Copy Current Tiers JSON</button></div></details></div><div class="panel"><label for="fighterSearch">Search characters</label><input id="fighterSearch" type="search" autocomplete="off" placeholder="Type a character name…" value="${esc(tierSearchQuery)}" style="width:100%;max-width:420px;margin-top:8px"><small id="searchCount" class="muted"></small></div><div class="tiers" id="tierResults">${groups}</div>`;
const searchInput=app.querySelector('#fighterSearch');const updateSearch=()=>{tierSearchQuery=searchInput.value;const term=tierSearchQuery.toLocaleLowerCase();let total=0;app.querySelectorAll('.tiergroup').forEach(group=>{let shown=0;group.querySelectorAll('.fighter').forEach(card=>{const match=card.querySelector('.name').textContent.toLocaleLowerCase().includes(term);card.hidden=!match;card.style.display=match?'':'none';if(match)shown++});group.hidden=shown===0;group.style.display=shown?'':'none';group.querySelector('h3 small').textContent=shown+' fighters';total+=shown});app.querySelector('#searchCount').textContent=term?` ${total} matching character${total===1?'':'s'}`:'';let empty=app.querySelector('#noSearchResults');if(empty)empty.remove();if(!total){const message=document.createElement('div');message.id='noSearchResults';message.className='empty';message.textContent='No characters match your search.';app.querySelector('#tierResults').append(message)}};searchInput.addEventListener('input',updateSearch);updateSearch();
app.querySelectorAll('[data-fighter]').forEach(el=>el.onchange=()=>{state.tiers[el.dataset.fighter]=el.value;save();renderTiers(app);const next=app.querySelector('#fighterSearch');next.focus();next.setSelectionRange(next.value.length,next.value.length)});app.querySelector('#saveList').onclick=()=>{let n=app.querySelector('#listName').value.trim();if(!n)return toast('Enter a tier list name.');state.saved[n]={...state.tiers};state.selectedList=n;save();toast('Saved '+n);render()};app.querySelector('#loadList').onclick=()=>{let n=app.querySelector('#savedSelect').value;if(!n||!state.saved[n])return toast('Select a saved list.');state.tiers={...state.saved[n]};state.selectedList=n;save();render();toast('Loaded '+n)};app.querySelector('#deleteList').onclick=()=>{let n=app.querySelector('#savedSelect').value;if(!n)return; if(!confirm('Delete saved tier list '+n+'?'))return;delete state.saved[n];if(state.selectedList===n)state.selectedList='';save();render()};app.querySelector('#resetTiers').onclick=()=>{if(!confirm('Reset all fighter tiers to your custom defaults?'))return;state.tiers={...state.defaults};state.selectedList='';save();render()};app.querySelector('#importDefault').onclick=()=>{try{let v=JSON.parse(app.querySelector('#importJson').value);if(!v||Array.isArray(v)||typeof v!=='object')throw Error('Expected a JSON object');for(let [n,t] of Object.entries(v)){if(!names.includes(n))throw Error('Unknown fighter: '+n);if(!T.includes(t))throw Error('Invalid tier for '+n)}state.defaults={...state.defaults,...v};state.tiers={...state.defaults};state.selectedList='';save();render();toast('Custom defaults imported')}catch(e){toast(e.message)}};app.querySelector('#exportTiers').onclick=()=>navigator.clipboard.writeText(JSON.stringify(state.tiers,null,2)).then(()=>toast('Copied tiers to clipboard')).catch(()=>toast('Clipboard unavailable'))}
function renderPlayers(app){app.innerHTML=`<div class="panel"><h2>Players</h2><p class="muted">Changing players preserves every existing name's history, even when they are inactive. Reset deletes all player histories and stats.</p><div class="toolbar"><label>Number of players <select id="count">${Array.from({length:8},(_,i)=>`<option value="${i+1}" ${(editing?state._editCount||state.players.length||1:state.players.length||1)===i+1?'selected':''}>${i+1}</option>`).join('')}</select></label><button id="changePlayers">Change Players</button><button id="resetPlayers" class="danger">Reset Players & Stats</button></div><div id="nameForm"></div></div><div class="playergrid">${state.players.map((n,i)=>`<div class="playercard"><h3>${i+1}. ${esc(n)}</h3><small>${(state.history[n]||[]).length} characters played</small></div>`).join('')||'<div class="empty">No players configured yet.</div>'}</div>`;const count=app.querySelector('#count'),form=app.querySelector('#nameForm');function drawForm(){let countN=+count.value;form.innerHTML=`<div class="playergrid">${Array.from({length:countN},(_,i)=>`<label>Player ${i+1}<input class="playerName" maxlength="40" placeholder="Player ${i+1}" value="${esc(state.players[i]||'')}"></label>`).join('')}</div><div class="toolbar"><button class="primary" id="applyPlayers">Save Players</button></div>`;form.querySelector('#applyPlayers').onclick=()=>{let values=[...form.querySelectorAll('.playerName')].map((el,i)=>el.value.trim()||'Player '+(i+1));if(new Set(values.map(v=>v.toLowerCase())).size!==values.length)return toast('Player names must be unique.');state.players=values;for(let n of values)state.history[n]??=[];state.configured=true;save();editing=false;render();toast('Players saved')};}count.onchange=drawForm;app.querySelector('#changePlayers').onclick=()=>{editing=true;drawForm()};app.querySelector('#resetPlayers').onclick=()=>{if(!confirm('Permanently clear all players, character histories and stats?'))return;state.players=[];state.history={};state.current=[];state.streakAlerts=[];state.pool=[...names];notice="";state.configured=false;editing=true;save();render();toast('Players and stats reset')};if(editing||!state.configured)drawForm()}
function eligible(n){let h=state.history[n]||[];if(h.length<2)return T;let [a,b]=h.slice(-2).map(x=>x.tier);if(a==='S'&&b==='S')return ['C','D'];if((a==='S'&&b==='A')||(a==='A'&&b==='S'))return ['B','C','D'];if(a==='D'&&b==='D')return ['S','A'];if((a==='C'&&b==='D')||(a==='D'&&b==='C'))return ['S','A','B'];return T}
function solve(pool){let order=state.players.map((n,i)=>({n,i,opts:pool.filter(c=>eligible(n).includes(state.tiers[c]))})).sort((a,b)=>a.opts.length-b.opts.length);if(order.some(x=>!x.opts.length))return null;let used=new Set(),out=Array(state.players.length);function walk(i){if(i===order.length)return true;let x=order[i],options=x.opts.filter(c=>!used.has(c)).sort(()=>Math.random()-.5);for(let c of options){used.add(c);out[x.i]=c;if(walk(i+1))return true;used.delete(c)}return false}return walk(0)?out:null}
function randomize(){if(!state.players.length)return toast('Add players first.');let result=solve(state.pool);if(!result){notice='Need to Refresh the Pool!';state.pool=[...names];result=solve(state.pool)}else notice='';if(!result){notice='No valid assignment is possible with the current tiers and player histories. Edit the tier list to add eligible fighters.';render();return}state.current=state.players.map((n,i)=>({name:n,character:result[i],tier:state.tiers[result[i]]}));const streakAlerts=[];for(const r of state.current){const prior=state.history[r.name]||[];if(prior.length&&prior[prior.length-1].tier===r.tier&&['S','D'].includes(r.tier)){streakAlerts.push({name:r.name,tier:r.tier})}}state.streakAlerts=streakAlerts;for(let r of state.current){state.history[r.name]??=[];state.history[r.name].push({character:r.character,tier:r.tier,date:new Date().toISOString()})}state.pool=state.pool.filter(c=>!result.includes(c));save();render();if(notice==='Need to Refresh the Pool!')toast(notice)}
function renderRandomizer(app){app.innerHTML=`<div class="panel"><h2>Randomizer</h2><p class="muted">Assign one unique fighter to each active player. A fighter stays out of the pool until a refresh is required. Eligibility is based on each player's last two recorded tiers.</p><div class="toolbar"><button class="primary" id="roll">🎲 Randomize All Players</button><span class="muted">${state.pool.length} / ${names.length} fighters available</span><button id="poolReset">Manually Refresh Pool</button></div>${notice?`<div class="notice">${esc(notice)}</div>`:''}${(state.streakAlerts||[]).map(a=>`<div class="streaknotice ${a.tier==='D'?'buff':''}">${esc(a.name)} got two ${a.tier}-Tiers in a row and needs to ${a.tier==='S'?'be nerfed!':'get buffed!'}</div>`).join('')}</div><div class="results">${state.current.length?state.current.map(r=>`<div class="resultcard"><small>PLAYER</small><h3>${esc(r.name)}</h3>${portrait(r.character)}<h3>${esc(r.character)}</h3><span class="pill ${r.tier}">Tier ${r.tier}</span></div>`).join(''):'<div class="empty">Press Randomize to get your fighters.</div>'}</div>`;app.querySelector('#roll').onclick=randomize;app.querySelector('#poolReset').onclick=()=>{state.pool=[...names];notice='Pool refreshed manually.';save();render()}}
function renderStats(app){let all=Object.keys(state.history);app.innerHTML=`<div class="panel"><h2>Stats</h2><p class="muted">Stats include active and previously used player names. Tiers are recorded at the moment a fighter is assigned.</p></div><div class="statsgrid">${all.map(n=>{let h=state.history[n]||[],counts=Object.fromEntries(T.map(t=>[t,h.filter(x=>x.tier===t).length])),score=h.reduce((s,x)=>s+points[x.tier],0);return `<section class="playercard"><h3>${esc(n)} ${state.players.includes(n)?'':'<small>(inactive)</small>'}</h3><div class="statrow"><span>Characters played</span><strong>${h.length}</strong></div><div class="statrow"><span>Tier Score</span><strong>${score}</strong></div><div class="statrow"><span>Average</span><strong>${h.length?(score/h.length).toFixed(2):"0.00"}</strong></div><h4>Tier distribution</h4>${T.map(t=>`<div class="chartrow"><b>${t}</b><div class="bar"><div class="${t}" style="width:${h.length?100*counts[t]/h.length:0}%"></div></div><span>${counts[t]}</span></div>`).join('')}<h4>Character history</h4><ol class="history">${h.map(x=>`<li>${esc(x.character)} <span class="pill ${x.tier}">${x.tier}</span></li>`).join('')||'<small>No characters yet.</small>'}</ol></section>`}).join('')||'<div class="empty">Add players on the Players page to start tracking stats.</div>'}</div>`}
render();
</script></body></html>
